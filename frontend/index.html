<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Match Analyzer</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>

<div class="container">
  <h1>Resume Parser</h1>
  <p class="subtitle">Upload your resume and paste a job description to see how well they match.</p>

  <div class="form-group">
    <label for="resume-file">Resume (PDF or DOCX)</label>
    <input type="file" id="resume-file" accept=".pdf,.docx">
  </div>

  <div class="form-group">
    <label for="jd-text">Job Description</label>
    <textarea id="jd-text" rows="8" placeholder="Paste the job description here..."></textarea>
  </div>

  <button id="analyze-btn" onclick="analyzeResume()">Analyze Match →</button>

  <div id="loading" class="loading" style="display:none;">
    <div class="loader"></div>
    <p>Analyzing... this can take a few seconds.</p>
  </div>

  <div id="result-container"></div>
</div>

<script src="script.js"></script>
</body>
</html>
